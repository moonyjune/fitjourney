<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Tổng quan hộp thoại</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#110D22;color:#F4F1FF;font-family:'Chakra Petch',sans-serif;padding:36px 40px}
h1{margin:0;font-size:40px} .sub{color:#B3AACF;font-size:18px;margin:6px 0 26px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:28px 24px;align-items:start}
.card{background:#1C1636;border:2px solid #3A2F6B;border-radius:20px;padding:12px}
.card h2{margin:0 0 8px;font-size:17px;color:#FFC83D;line-height:1.25}
.card h2 span{color:#B3AACF;font-weight:500}
.card img{width:100%;border-radius:12px;display:block;border:1px solid #3A2F6B}
.water{border-color:#1F5A78}
</style></head><body>

<div class="grid" id="g"></div>
