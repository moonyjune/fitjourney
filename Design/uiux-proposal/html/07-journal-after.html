<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Nhật ký đề xuất</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css"><script src="kit.js"></script>
<style>.day{flex:1;min-height:76px;border-radius:12px;background:var(--panel);border:1.5px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6px 0}.day.on{background:var(--gold);border-color:var(--gold);color:var(--onGold)}.bars{display:flex;align-items:flex-end;gap:10px;height:96px;padding:0 4px;border-bottom:1px solid var(--border);position:relative}.bars i{flex:1;border-radius:6px 6px 0 0;display:block}</style></head><body>
<div data-status="after"></div>
<div class="content">
  <div class="header"><div class="iconbtn"><i data-i="back"></i></div><span class="h2 grow">Nhật ký</span><span class="chip s"><i data-i="calendar"></i>Tuần 44</span></div>
  <div class="seg mt4"><div>Ngày</div><div class="on">Tuần</div><div>Tháng</div></div>
  <div class="row gap4 mt12" style="gap:5px">
    <div class="day"><span class="t11 med">T2</span><b class="t15">26</b><span class="t10 cx">720</span></div>
    <div class="day"><span class="t11 med">T3</span><b class="t15">27</b><span class="t10 cg">380</span></div>
    <div class="day"><span class="t11 med">T4</span><b class="t15">28</b><span class="t10 cx">810</span></div>
    <div class="day"><span class="t11 med">T5</span><b class="t15">29</b><span class="t10 chp">−150</span></div>
    <div class="day"><span class="t11 med">T6</span><b class="t15">30</b><span class="t10 cx">650</span></div>
    <div class="day"><span class="t11 med">T7</span><b class="t15">31</b><span class="t10 cg">🎉</span></div>
    <div class="day on"><span class="t11 med">CN</span><b class="t15">1</b><span class="t10">640</span></div>
  </div>
  <div class="panel boss row gap12 mt12" style="padding:12px">
    <div data-boss="#FF5470" data-size="56" data-mood="sad"></div>
    <div class="grow"><div class="row between"><b>Boss tuần</b><span class="t12 chp">−3,050 HP</span></div><div class="bar thin mt6"><i style="width:40%;background:var(--hp)"></i></div><div class="t12 c2 med mt4">4/6 ngày đạt · cần ~1,550/ngày để hạ</div></div>
  </div>
  <div class="row between mt16"><span class="h3">Thâm hụt mỗi ngày</span><span class="t12 c2 med">mục tiêu 500</span></div>
  <div class="bars mt8">
    <div style="position:absolute;left:0;right:0;bottom:48px;border-top:1.5px dashed var(--gold);opacity:.6"></div>
    <i style="height:70px;background:var(--xp)"></i><i style="height:37px;background:var(--gold)"></i><i style="height:79px;background:var(--xp)"></i><i style="height:4px;background:var(--hp)"></i><i style="height:63px;background:var(--xp)"></i><i style="height:4px;background:var(--border)"></i><i style="height:62px;background:var(--xp)"></i>
  </div>
  <div class="row gap8 mt12">
    <div class="panel col" style="flex:1;padding:10px"><span class="t11 c2 med">Cân nặng</span><b class="t18 cx">−0.6 kg</b><svg width="90" height="22"><polyline points="0,4 15,6 30,5 45,10 60,12 75,15 90,18" stroke="#8BFF6B" stroke-width="2.5" fill="none"/></svg></div>
    <div class="panel col" style="flex:1;padding:10px"><span class="t11 c2 med">Nước TB</span><b class="t18 cm">2.1 L</b><span class="t11 c2 med">5/7 ngày đủ</span></div>
    <div class="panel col" style="flex:1;padding:10px"><span class="t11 c2 med">Tâm trạng</span><b class="t18">🙂</b><span class="t11 c2 med">thèm 3/5</span></div>
  </div>
  <div class="panel row gap10 mt12" style="padding:12px;border-color:var(--manaB)"><span class="cm t22"><i data-i="ai"></i></span><div class="grow"><b class="t14">Tổng kết tuần (AI)</b><div class="t12 c2 med">T5 ăn dư vì liên hoan · thử bữa tối ≤ 500 kcal</div></div><span class="c2"><i data-i="next"></i></span></div>
</div>
</body></html>
