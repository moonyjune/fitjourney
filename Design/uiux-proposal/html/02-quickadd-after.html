<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Quick add đề xuất</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css"><script src="kit.js"></script></head><body>
<div data-status="after"></div>
<div class="content" style="opacity:.35">
  <div class="row gap8"><div style="font-size:34px;color:var(--gold)"><i data-i="shield"></i></div><div class="grow t15 bold">Cấp 7</div></div>
  <div class="panel mt12" style="height:200px"></div>
</div>
<div class="scrim" style="top:44px"></div>
<div class="sheet" style="padding-bottom:96px">
  <div class="grab"></div>
  <div class="row"><div class="grow h2">Ghi nhanh</div><span class="chip"><i data-i="calendar"></i>Hôm nay<i data-i="down"></i></span><div class="iconbtn" style="margin-left:8px"><i data-i="x"></i></div></div>
  <div class="panel row gap12 mt12" style="background:var(--gold);border-color:var(--gold);color:var(--onGold);padding:14px;box-shadow:0 4px 0 #b88a14">
    <span style="font-size:32px"><i data-i="camera"></i></span>
    <div class="grow"><div class="t18 bold">Chụp món ăn</div><div class="t12 med">hoặc chọn ảnh · AI tách món, tính kcal</div></div>
    <span style="font-size:20px"><i data-i="next"></i></span>
  </div>
  <div class="row gap8 mt8">
    <div class="btn ghost sm" style="flex:1"><span class="cg"><i data-i="mic"></i></span>Nói / gõ món</div>
    <div class="btn ghost sm" style="flex:1"><span class="cg"><i data-i="search"></i></span>Món đã lưu</div>
  </div>
  <div class="row between mt16"><span class="t15 bold">Ăn lại</span><span class="t12 c2 med">chạm 1 lần để ghi</span></div>
  <div class="row gap8 mt8">
    <div class="col" style="flex:1"><img src="img/pho.jpg" style="height:70px;border-radius:12px;object-fit:cover;width:100%"><span class="t12 mt4">Phở bò</span><span class="t11 c2 med">480 kcal</span></div>
    <div class="col" style="flex:1"><img src="img/comtam.jpg" style="height:70px;border-radius:12px;object-fit:cover;width:100%"><span class="t12 mt4">Cơm tấm</span><span class="t11 c2 med">620 kcal</span></div>
    <div class="col" style="flex:1"><img src="img/goicuon.jpg" style="height:70px;border-radius:12px;object-fit:cover;width:100%"><span class="t12 mt4">Chả giò ×3</span><span class="t11 c2 med">300 kcal</span></div>
  </div>
  <div class="panel manaPanel row gap10 mt16" style="padding:10px 12px">
    <span class="cm" style="font-size:24px"><i data-i="drop"></i></span>
    <div class="grow"><b class="t15">1.5 / 2.5 L</b><div class="bar thin mt4" style="background:#0b1d2a"><i style="width:60%;background:var(--mana)"></i></div></div>
    <span class="chip mana big">+250</span><span class="chip mana big">+500</span>
  </div>
  <div class="row gap8 mt12">
    <span class="chip big" style="flex:1"><span class="c2"><i data-i="scale"></i></span>79.4 kg</span>
    <span class="chip big" style="flex:1"><span class="cg"><i data-i="smile"></i></span>Cảm giác</span>
    <span class="chip big" style="flex:1"><span class="cx"><i data-i="dumbbell"></i></span>Tập khác</span>
  </div>
</div>
<div style="position:absolute;left:16px;right:16px;bottom:24px;background:#0b1d2a;border:1.5px solid var(--manaB);border-radius:14px;padding:0 6px 0 14px;height:48px" class="row between"><span class="t14 cm">+250 ml nước · 1.5 L</span><span class="chip" style="border:none;background:transparent;color:var(--gold)"><i data-i="undo"></i>Hoàn tác</span></div>
</body></html>
