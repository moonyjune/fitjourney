<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Pop-up nước đề xuất</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css"><script src="kit.js"></script>
<style>.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--manaB)}</style></head><body>
<div data-status="after"></div>
<div class="content" style="opacity:.35"><div class="h2">Cấp 7</div><div class="panel mt12" style="height:220px"></div></div>
<div class="scrim" style="top:44px"></div>
<div class="sheet" style="background:var(--manaP);border-color:var(--manaB)">
  <div class="grab" style="background:var(--manaB)"></div>
  <div class="row gap16" style="gap:16px">
    <svg width="78" height="100" viewBox="0 0 78 100"><defs><clipPath id="g"><path d="M8 6h62l-7 88H15z"/></clipPath></defs><path d="M8 6h62l-7 88H15z" fill="#0b1d2a" stroke="#4CC9F0" stroke-width="3"/><g clip-path="url(#g)"><rect x="0" y="58" width="78" height="42" fill="#4CC9F0" opacity=".85"/><path d="M0 58q10-6 20 0t20 0 20 0 20 0" fill="#8EDDF5"/></g></svg>
    <div class="grow"><div class="t12 cm med">13:00 · nhắc uống nước</div><div class="h1 mt4">Uống 500 ml</div><div class="t13 c3 med mt4">1.0 / 2.5 L · đang chậm 250 ml</div></div>
  </div>
  <div class="row between mt16" style="padding:0 2px">
    <div class="col" style="align-items:center;gap:4px"><div class="dot" style="background:var(--mana);border-color:var(--mana)"></div><span class="t10 c2">6:30</span></div>
    <div class="col" style="align-items:center;gap:4px"><div class="dot" style="background:var(--mana);border-color:var(--mana)"></div><span class="t10 c2">9:00</span></div>
    <div class="col" style="align-items:center;gap:4px"><div class="dot" style="border-color:var(--hp)"></div><span class="t10 chp">11:00</span></div>
    <div class="col" style="align-items:center;gap:4px"><div class="dot" style="border-color:var(--gold);box-shadow:0 0 0 4px rgba(255,200,61,.25)"></div><span class="t10 cg">13:00</span></div>
    <div class="col" style="align-items:center;gap:4px"><div class="dot"></div><span class="t10 c2">15:00</span></div>
    <div class="col" style="align-items:center;gap:4px"><div class="dot"></div><span class="t10 c2">17:00</span></div>
    <div class="col" style="align-items:center;gap:4px"><div class="dot"></div><span class="t10 c2">19:00</span></div>
    <div class="col" style="align-items:center;gap:4px"><div class="dot"></div><span class="t10 c2">20:30</span></div>
  </div>
  <div class="btn mana mt16"><i data-i="check"></i>Đã uống 500 ml</div>
  <div class="row gap8 mt10"><span class="chip mana big" style="flex:1">250 ml</span><span class="chip mana big" style="flex:1">750 ml</span><span class="chip big" style="flex:1.3"><i data-i="clock"></i>Nhắc sau 30′</span></div>
</div>
</body></html>
