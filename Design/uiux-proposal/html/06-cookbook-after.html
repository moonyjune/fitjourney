<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Cook book đề xuất</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css"><script src="kit.js"></script>
<style>.card{background:var(--panel);border:1.5px solid var(--border);border-radius:16px;overflow:hidden}.card img{width:100%;height:104px;object-fit:cover;display:block}.card .b{padding:8px 10px 10px}</style></head><body>
<div data-status="after"></div>
<div class="content">
  <div class="header"><div class="iconbtn"><i data-i="back"></i></div><span class="h2 grow">Cook book</span><div class="iconbtn" style="color:var(--gold)"><i data-i="sparkle"></i></div></div>
  <div class="row gap8 mt4">
    <div class="raised grow row gap8" style="height:44px;padding:0 12px;border:1.5px solid var(--border)"><span class="c2"><i data-i="search"></i></span><span class="t14 c2 med">Tìm món, nguyên liệu…</span></div>
    <div class="iconbtn" style="position:relative"><i data-i="filter"></i><span style="position:absolute;top:-6px;right:-6px;background:var(--gold);color:var(--onGold);border-radius:99px;font-size:11px;padding:1px 6px">2</span></div>
  </div>
  <div class="seg mt10"><div class="on">Món của tôi · 12</div><div>🎉 Cheat day · 3</div></div>
  <div class="row gap6 mt10"><span class="chip s on">Vừa bữa trưa</span><span class="chip s">Ít purine</span><span class="chip s">≤ 20′</span><span class="chip s">★ đã chấm</span></div>
  <div class="row gap10 mt12" style="flex-wrap:wrap">
    <div class="card" style="width:calc(50% - 5px)"><img src="img/buncha.jpg"><div class="b"><b class="t14">Bún chả ít bún</b><div class="row between mt4"><span class="t12 c2 med">450 kcal · 32 g</span><span class="badge xp">Vừa</span></div></div></div>
    <div class="card" style="width:calc(50% - 5px)"><img src="img/salad.jpg"><div class="b"><b class="t14">Salad ức gà</b><div class="row between mt4"><span class="t12 c2 med">380 kcal · 41 g</span><span class="badge xp">Vừa</span></div></div></div>
    <div class="card" style="width:calc(50% - 5px)"><img src="img/pho.jpg"><div class="b"><b class="t14">Phở bò tái</b><div class="row between mt4"><span class="t12 c2 med">480 kcal · 28 g</span><span class="badge gold">+20</span></div></div></div>
    <div class="card" style="width:calc(50% - 5px)"><img src="img/bunbo.jpg"><div class="b"><b class="t14">Bún bò Huế</b><div class="row between mt4"><span class="t12 c2 med">560 kcal · 30 g</span><span class="badge hp">Purine cao</span></div></div></div>
  </div>
  <div class="fade-bottom" style="height:90px"></div>
</div>
<div class="btn" style="position:absolute;left:16px;right:16px;bottom:26px"><i data-i="sparkle"></i>Gợi ý món mới cho bữa trưa</div>
</body></html>
