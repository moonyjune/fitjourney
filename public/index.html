<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="theme-color" content="#110D22" />
    <title>FitJourney</title>
    <style id="expo-reset">
      html, body { height: 100%; background: #110D22; }
      body { overflow: hidden; }
      #root { display: flex; height: 100%; flex: 1; }
      /* Static splash: visible the instant the page opens, before the JS bundle has downloaded. It is a sibling that
         follows #root, so it disappears as soon as React mounts into #root (the in-app intro then takes over,
         drawn to look the same: src/components/AppIntro.tsx). */
      #boot { position: fixed; top: 0; right: 0; bottom: 0; left: 0; display: flex; flex-direction: column; align-items: center;
        justify-content: space-between; padding: 56px 0; background: #110D22; color: #F4F1FF;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; z-index: 1; }
      #root:not(:empty) ~ #boot { display: none; }
      #boot .mid { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; }
      #boot .glow { position: relative; width: 251px; height: 251px; display: flex; align-items: center; justify-content: center; }
      #boot .glow::before { content: ''; position: absolute; width: 317px; height: 317px; left: -33px; top: -33px;
        background: radial-gradient(circle closest-side, rgba(255,200,61,0.34) 0%, rgba(255,200,61,0.1) 55%, rgba(255,200,61,0) 100%); }
      #boot .glow svg { position: relative; }
      #boot .name { font-size: 34px; font-weight: 700; letter-spacing: 4px; text-align: center; text-transform: uppercase; }
      #boot .tag { font-size: 13px; color: #B3AACF; text-align: center; line-height: 19px; max-width: 330px; padding: 0 32px; margin: 8px auto 0; }
      #boot .lbl { font-size: 11px; letter-spacing: 1.6px; color: #B3AACF; text-align: center; text-transform: uppercase; }
      #boot .track { width: 220px; height: 8px; border-radius: 4px; background: #241C44; overflow: hidden; margin: 10px auto 0; }
      #boot .fill { width: 100%; height: 100%; background: #FFC83D; transform-origin: left; animation: bootfill 2.4s cubic-bezier(.2,.7,.2,1) forwards; }
      @keyframes bootfill { from { transform: scaleX(0.04); } to { transform: scaleX(0.9); } }
      @media (prefers-reduced-motion: reduce) { #boot .fill { animation: none; transform: scaleX(0.5); } }
    </style>
  </head>
